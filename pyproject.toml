[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "torn-python-sdk"
version = "0.1.0"
description = "Fully typed synchronous and asynchronous SDK for the official Torn API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "swervelord"}]
keywords = ["torn", "torn-api", "httpx", "sdk", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "typing-extensions>=4.13"]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/swervelord/Torn-Python-SDK"
Issues = "https://github.com/swervelord/Torn-Python-SDK/issues"

[tool.setuptools.package-data]
torn_sdk = ["py.typed", "*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["live: makes real requests to api.torn.com"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
