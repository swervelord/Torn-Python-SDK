name: Python SDK verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/generate.py --check
      - run: python scripts/generate_error_codes.py --check
      - run: python -m pytest -m "not live"

  package:
    name: Lint, type check and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src/torn_sdk examples/typed_consumer.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify an installed wheel from outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/torn-consumer"
          consumer="$RUNNER_TEMP/torn-consumer/bin/python"
          "$consumer" -m pip install dist/*.whl
          cp examples/typed_consumer.py "$RUNNER_TEMP/typed_consumer.py"
          cd "$RUNNER_TEMP"
          "$consumer" -I typed_consumer.py
